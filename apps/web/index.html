<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#17191f" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        // Keep the migration in sync with hooks/useTheme.ts and the colors with the shared palettes.
        let mode = "dark";
        try {
          const storage = window.localStorage;
          const stored = storage.getItem("lief:theme");
          const legacyMode = storage.getItem("lief:theme-appearance-mode");
          const legacySystem = storage.getItem("lief:theme-follow-system");
          mode =
            legacyMode === "light" || legacyMode === "dark" || legacyMode === "system"
              ? legacyMode
              : stored === "system" || legacySystem === "true"
                ? "system"
                : stored === "lief-light" ||
                    stored === "light" ||
                    stored === "porcelain" ||
                    stored === "mist"
                  ? "light"
                  : "dark";
          const preference = mode === "system" ? mode : "lief-" + mode;
          if (stored !== preference && (stored !== null || mode !== "dark")) {
            storage.setItem("lief:theme", preference);
          }
          if (legacyMode !== null) storage.removeItem("lief:theme-appearance-mode");
          if (legacySystem !== null) storage.removeItem("lief:theme-follow-system");
        } catch {}

        let isDark = mode === "dark";
        if (mode === "system") {
          try {
            isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch {}
        }
        const background = isDark ? "#17191f" : "#f8f7f3";
        const foreground = isDark ? "#f2f3f8" : "#171c29";
        const root = document.documentElement;
        root.dataset.themeId = isDark ? "lief-dark" : "lief-light";
        root.classList.toggle("dark", isDark);
        root.style.backgroundColor = background;
        root.style.setProperty("--boot-background", background);
        root.style.setProperty("--boot-foreground", foreground);
        for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
          meta.setAttribute("content", background);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter Variable", "Segoe UI", system-ui, sans-serif;
      }

      html.dark body {
        background: #000000;
        color: #f5f5f5;
      }

      #boot-shell {
        position: relative;
        overflow: hidden;
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: var(--boot-background, #17191f);
        color: var(--boot-foreground, #f2f3f8);
      }

      #boot-shell-fallback {
        text-align: center;
      }

      #boot-shell:has(> #boot-shell-fallback:not([hidden])) {
        flex-direction: column;
        gap: 12px;
      }

      #boot-shell-fallback a {
        color: inherit;
        text-decoration-line: underline;
        text-underline-offset: 3px;
      }

      #boot-shell-card {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }

      /* App CSS locks body and #root scrolling once main loads, so the error screen scrolls itself. */
      #boot-shell:has(> #boot-error) {
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }

      #boot-error {
        --boot-error-fg: var(--boot-foreground, #f2f3f8);
        --boot-error-bg: var(--boot-background, #17191f);
        --boot-error-line: color-mix(in srgb, currentColor 12%, transparent);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        align-self: flex-start;
        width: min(400px, calc(100% - 48px));
        padding: clamp(24px, 22vh, 220px) 0 24px;
        font-size: 13px;
        line-height: 20px;
      }

      #boot-error h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 22px;
      }

      #boot-error p {
        margin: 4px 0 0;
        opacity: 0.7;
        overflow-wrap: anywhere;
        text-wrap: pretty;
      }

      #boot-error code,
      #boot-error pre {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      #boot-error a {
        color: inherit;
        text-decoration-line: underline;
        text-decoration-color: color-mix(in srgb, currentColor 40%, transparent);
        text-underline-offset: 3px;
      }

      #boot-error a:hover {
        text-decoration-color: currentColor;
      }

      #boot-error button {
        height: 32px;
        padding: 0 14px;
        border: 1px solid var(--boot-error-line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }

      #boot-error button[aria-disabled="true"] {
        opacity: 0.6;
        cursor: default;
      }

      #boot-error :is(button, a, summary, pre):focus-visible {
        outline: 2px solid var(--boot-error-fg);
        outline-offset: 2px;
      }

      #boot-error-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      #boot-error #boot-error-reload {
        border-color: var(--boot-error-fg);
        background: var(--boot-error-fg);
        color: var(--boot-error-bg);
      }

      #boot-error-reload:hover {
        opacity: 0.9;
      }

      #boot-error #boot-error-update-note {
        margin-top: 8px;
        font-size: 12px;
        line-height: 18px;
      }

      #boot-error details {
        width: 100%;
        margin-top: 32px;
      }

      #boot-error summary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 4px;
        list-style: none;
        opacity: 0.7;
        cursor: pointer;
      }

      #boot-error summary::-webkit-details-marker {
        display: none;
      }

      #boot-error summary::before {
        content: "";
        width: 5px;
        height: 5px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg);
      }

      #boot-error details[open] summary::before {
        transform: rotate(45deg);
      }

      #boot-error summary:hover,
      #boot-error details[open] summary {
        opacity: 1;
      }

      #boot-error details > :not(summary) {
        display: grid;
        gap: 8px;
        margin-top: 20px;
      }

      #boot-error details > a {
        display: block;
        width: fit-content;
      }

      #boot-error details p {
        margin: 0;
        font-size: 12px;
        line-height: 18px;
      }

      #boot-error-command {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 4px 4px 10px;
        border: 1px solid var(--boot-error-line);
        border-radius: 6px;
      }

      #boot-error-command code {
        flex: 1;
        min-width: 0;
        opacity: 0.8;
      }

      #boot-error .boot-error-icon {
        display: grid;
        flex: none;
        place-items: center;
        min-width: 24px;
        height: 24px;
        padding: 0 4px;
        border: 0;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 400;
        opacity: 0.7;
      }

      #boot-error .boot-error-icon:hover {
        opacity: 1;
        background: color-mix(in srgb, currentColor 8%, transparent);
      }

      #boot-error-details {
        max-height: 200px;
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        border: 1px solid var(--boot-error-line);
        border-radius: 6px;
        font-size: 11px;
        line-height: 16px;
        white-space: pre-wrap;
        opacity: 0.8;
      }

      #boot-error-report {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      #boot-error-report button {
        height: 28px;
        padding: 0 10px;
      }

      .boot-error-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
    <script>
      // Desktop's preload injects branding before page scripts. Titling before the <title> below
      // parses keeps Electron from reporting the web build's channel to the window first.
      const desktopDisplayName = window.desktopBridge?.getAppBranding?.()?.displayName;
      if (desktopDisplayName) document.title = desktopDisplayName;
    </script>
    <!-- vite.config.ts stamps the web build's channel into this title. -->
    <title>Lief.code</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="Lief.code" />
        </div>
        <div id="boot-shell-fallback" hidden role="alert">
          Lief.code 启动失败。<a href="">重新加载</a>
        </div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
