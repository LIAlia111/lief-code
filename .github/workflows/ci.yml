name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: pnpm typecheck
      - run: vp lint
      - run: vp run knip:check
      - run: pnpm icons:check
